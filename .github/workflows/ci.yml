name: ci

on:
  push:
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -q -e ".[dev]"
      - name: Lint
        run: make lint
      - name: Unit tests (non-integration)
        run: make test

  stack:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - name: make up
        run: make up
      - name: make verify
        run: make verify
      - name: make down
        if: always()
        run: make down
