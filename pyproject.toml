[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mizan"
version = "0.0.1"
description = "MIZAN - differentiable hydraulic twin, federated surrogate, n8n/EPANET MVP (Miyahthon 2026 Track 4)"
requires-python = ">=3.11,<3.12"
dependencies = [
  "jax[cpu]==0.10.2",
  "wntr==1.5.0",
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
  "pydantic==2.13.5",
  "psycopg[binary]==3.3.5",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.7",
  "httpx==0.28.1",
]

[tool.setuptools.packages.find]
include = ["packages*"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", "data", "n8n", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the running Docker Compose stack"]
addopts = "-q"
